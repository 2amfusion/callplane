# NON-SECRET template for Railway Phase 1 (Callplane / LiveKit media server).
#
# === Option A (recommended): one multiline variable ===
# Railway → livekit-callplane → Variables → add:
#   LIVEKIT_CONFIG = <paste this entire file after replacing YOUR_* placeholders>
#
# === Option B: separate env vars (no LIVEKIT_CONFIG) ===
# See CALLPLANE.md "Railway environment variables". Server does NOT read LIVEKIT_API_KEY
# or LIVEKIT_API_SECRET — those names are for client SDKs / callplane-api only.
#
# Generate server keys locally (paste into keys: below or into LIVEKIT_KEYS):
#   go run ./cmd/server generate-keys
#
# Railway notes:
# - Do NOT set port: here — railway.toml passes --port $PORT (Railway injects PORT).
# - UDP port ranges are unreliable on Railway; use tcp_port + allow_tcp_fallback below.
# - Use Railway Redis private hostname (not localhost). Unfilled YOUR_* → crash at startup.
# - Quote redis.password if it contains ':' or '#' (YAML special chars).

redis:
  address: YOUR_REDIS_HOST:6379
  password: YOUR_REDIS_PASSWORD

# keys: is a YAML map — left side is the API key id, right side is the secret (not env var names).
keys:
  YOUR_KEY_ID: YOUR_KEY_SECRET

rtc:
  # TCP fallback when UDP is blocked or unavailable (common on PaaS).
  tcp_port: 7881
  allow_tcp_fallback: true
  use_external_ip: true
  # Avoid opening a wide UDP range on Railway — omit port_range_start/end or keep narrow if you add UDP later.
  # port_range_start: 50000
  # port_range_end: 60000

logging:
  level: info
