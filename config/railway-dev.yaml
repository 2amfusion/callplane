# NON-SECRET template for Railway Phase 1 (Callplane / LiveKit media server).
#
# How to use:
# 1. Copy this file locally and replace every YOUR_* placeholder with real values.
# 2. In Railway → your livekit-callplane service → Variables, add:
#      LIVEKIT_CONFIG = <paste the entire YAML below, as one multiline value>
# 3. Do NOT commit real Redis passwords or API secrets to git.
#
# Generate API keys locally:
#   go run ./cmd/server generate-keys
#
# Railway notes:
# - Do NOT set port here for Railway — railway.toml startCommand passes --port $PORT so health checks match.
# - For local/docker without $PORT, omit port (defaults to 7880) or set port: 7880.
# - UDP port ranges are unreliable on Railway; prefer TCP ICE (tcp_port + allow_tcp_fallback).
# - Add a Railway Redis plugin (or external Redis) and point redis.address below.
# - Replace YOUR_* placeholders before pasting into LIVEKIT_CONFIG (unfilled values crash at startup).

redis:
  address: YOUR_REDIS_HOST:6379
  password: YOUR_REDIS_PASSWORD

keys:
  YOUR_API_KEY: YOUR_API_SECRET

rtc:
  # TCP fallback when UDP is blocked or unavailable (common on PaaS).
  tcp_port: 7881
  allow_tcp_fallback: true
  use_external_ip: true
  # Avoid opening a wide UDP range on Railway — omit port_range_start/end or keep narrow if you add UDP later.
  # port_range_start: 50000
  # port_range_end: 60000

logging:
  level: info
