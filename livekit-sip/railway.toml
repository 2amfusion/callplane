# Railway config-as-code for livekit/sip (Callplane telephony bridge).
# Create a NEW service in the same project, set Root Directory = livekit-sip
# Docs: https://docs.railway.com/config-as-code

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Upstream reads inline YAML from env SIP_CONFIG_BODY (https://github.com/livekit/sip#config).
# livekit/sip does NOT read Railway's PORT — only health_port in YAML. docker-entrypoint.sh
# rewrites health_port to match $PORT before start (fixes #1 Railway health failure mode).
#
# Optional: set service variable PORT=8080 for a stable health port (recommended).
# SIP signaling uses sip_port (5060) — expose via TCP Proxy in dashboard, not PORT.
# Inbound UDP (5060/udp, RTP range) is NOT supported on Railway public edge as of 2026.
#
# Debug failing deploys: comment out healthcheckPath below, redeploy, read logs, re-enable.
# GET / returns 200 + body "OK" when healthy (503 if crashed or health_port unset pre-entrypoint).
healthcheckPath = "/"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
