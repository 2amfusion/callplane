# Railway config-as-code for livekit/sip (Callplane telephony bridge).
# Create a NEW service in the same project, set Root Directory = livekit-sip
# Docs: https://docs.railway.com/config-as-code
# Duplicate disable in railway.json (healthcheckPath: null) — see DEPLOY-SIP.md.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Upstream reads inline YAML from env SIP_CONFIG_BODY (https://github.com/livekit/sip#config).
# Railway probes $PORT only. docker-entrypoint.sh starts health-wrapper.sh on $PORT (always 200)
# before livekit-sip; sip health_port is internal (default 8081).
#
# Set service variable PORT=8080 (recommended). SIP signaling uses sip_port (5060) via TCP Proxy.
#
# Deploy health: GET / on $PORT. health-wrapper.sh returns 200 before livekit-sip starts, so this
# passes even with sticky dashboard "/" or wrong parent railway.toml (if image is current).
# To disable probing entirely: healthcheckPath = "" and railway.json healthcheckPath: null.
healthcheckPath = "/"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
