# Railway config-as-code for livekit/sip (Callplane telephony bridge).
# Create a NEW service in the same project, set Root Directory = livekit-sip
# Docs: https://docs.railway.com/config-as-code

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Upstream reads inline YAML from env SIP_CONFIG_BODY (https://github.com/livekit/sip#config).
# livekit/sip does NOT read Railway's PORT — only health_port in YAML. docker-entrypoint.sh
# rewrites health_port to match $PORT before start.
#
# Set service variable PORT=8080 (recommended). SIP signaling uses sip_port (5060) via TCP Proxy.
#
# Health check DISABLED — must be explicit. Omitting healthcheckPath does NOT turn checks off;
# Railway then uses the dashboard "Health Check Path" (often still "/"). Use empty string or
# null in railway.json to override dashboard. Re-enable after logs show "service ready":
#   healthcheckPath = "/"
#   healthcheckTimeout = 300
# When enabled: GET / on $PORT returns 200 + body "OK" (503 if not ready; 429 under CPU load).
healthcheckPath = ""
restartPolicyType = "ON_FAILURE"
