# Railway config-as-code for livekit/sip (Callplane telephony bridge).
# Create a NEW service in the same project, set Root Directory = livekit-sip
# Docs: https://docs.railway.com/config-as-code
#
# startCommand must be null (use Dockerfile ENTRYPOINT). See railway.json — empty
# string "" is NOT null and can prevent /docker-entrypoint.sh from running.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
