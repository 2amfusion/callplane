# Railway config-as-code for livekit/sip (Callplane telephony bridge).
# Create a NEW service in the same project, set Root Directory = livekit-sip
# Docs: https://docs.railway.com/config-as-code

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Upstream reads inline YAML from env SIP_CONFIG_BODY (https://github.com/livekit/sip#config).
# docker-entrypoint.sh sets health_port from Railway $PORT (default 8080) before starting livekit-sip.
# Health: GET / on $PORT returns 200 after Redis connects and SIP logs "service ready".
#
# Set service variable PORT=8080. SIP signaling uses sip_port (5060) via TCP Proxy.
healthcheckPath = "/"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
